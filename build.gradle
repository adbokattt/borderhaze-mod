plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

version = "${project.mod_version}+mc${project.minecraft_version}"
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	// Loom adds the essential maven repositories automatically.
}

loom {
	// Separate source sets: src/main (common: client + server) and src/client (client only)
	splitEnvironmentSourceSets()

	mods {
		"borderhaze" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

processResources {
	def modVersion = project.version
	inputs.property "version", modVersion

	filesMatching("fabric.mod.json") {
		expand "version": modVersion
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_${projectName}" }
	}
}


// ---------------------------------------------------------------------------
// Safety check: fail the build loudly if the mod jar is missing essential files.
// (A wrongly placed file in the repository does NOT fail a normal Gradle build -
//  it just produces a broken jar that Fabric Loader reports as a "non-fabric mod".)
// ---------------------------------------------------------------------------
tasks.register('verifyModJar') {
	dependsOn tasks.named('jar')
	doLast {
		def jarFile = tasks.named('jar').get().archiveFile.get().asFile

		def layout = fileTree(projectDir) {
			exclude '.git/**', '.gradle/**', 'build/**', '.idea/**', 'run/**'
		}.files.collect { projectDir.toPath().relativize(it.toPath()).toString().replace('\\', '/') }.sort()
		def layoutText = layout.collect { "  " + it }.join("\n")

		def zip = new java.util.zip.ZipFile(jarFile)
		def entries = zip.entries().collect { it.name }
		zip.close()

		def required = [
			'fabric.mod.json',
			'borderhaze.client.mixins.json',
			'dev/borderhaze/BorderHaze.class',
			'dev/borderhaze/settings/BorderHazeSettings.class',
			'dev/borderhaze/network/SettingsPayload.class',
			'dev/borderhaze/server/BorderHazeServer.class',
			'dev/borderhaze/server/ServerCommands.class',
			'dev/borderhaze/core/AdminPermission.class',
			'dev/borderhaze/glitch/GlitchMechanic.class',
			'dev/borderhaze/glitch/GlitchManager.class',
			'dev/borderhaze/glitch/GlitchCommands.class',
			'dev/borderhaze/glitch/GlitchStatePayload.class',
			'dev/borderhaze/glitch/GlitchEvents.class',
			'dev/borderhaze/glitch/GlitchApi.class',
			'dev/borderhaze/glitch/mixin/ServerPlayerMixin.class',
			'borderhaze.glitch.mixins.json',
			'dev/borderhaze/client/glitch/GlitchClient.class',
			'dev/borderhaze/client/glitch/GlitchClientState.class',
			'dev/borderhaze/client/glitch/GlitchAppearance.class',
			'dev/borderhaze/client/glitch/GlitchRenderFlag.class',
			'dev/borderhaze/client/glitch/mixin/AvatarRendererMixin.class',
			'dev/borderhaze/client/glitch/mixin/AvatarRenderStateMixin.class',
			'dev/borderhaze/client/glitch/mixin/GlitchLevelRendererMixin.class',
			'dev/borderhaze/client/glitch/GlitchTimeline.class',
			'dev/borderhaze/client/glitch/GlitchTextures.class',
			'dev/borderhaze/client/glitch/render/GlitchEffect.class',
			'dev/borderhaze/client/glitch/render/GlitchUniforms.class',
			'dev/borderhaze/client/core/UniformBinder.class',
			'borderhaze.glitch.client.mixins.json',
			'assets/borderhaze/textures/entity/glitch.png',
			'assets/borderhaze/textures/entity/glitch_hole_head.png',
			'assets/borderhaze/textures/entity/glitch_hole_all.png',
			'assets/borderhaze/post_effect/glitch.json',
			'assets/borderhaze/shaders/post/glitch.fsh',
			'dev/borderhaze/client/BorderHazeClient.class',
			'dev/borderhaze/client/mixin/WorldBorderRendererMixin.class',
			'dev/borderhaze/client/mixin/LevelRendererMixin.class',
			'dev/borderhaze/client/mixin/GameRendererMixin.class',
			'dev/borderhaze/client/render/BorderEffect.class',
			'dev/borderhaze/client/render/BorderUniforms.class',
			'dev/borderhaze/client/render/EdgeUniforms.class',
			'dev/borderhaze/client/config/HazeConfig.class',
			'dev/borderhaze/client/command/BorderHazeCommand.class',
			'dev/borderhaze/client/sound/BorderSound.class',
			'dev/borderhaze/client/sound/BorderHumSoundInstance.class',
			'dev/borderhaze/client/mixin/optional/HudVignetteMixin.class',
			'borderhaze.optional.mixins.json',
			'assets/borderhaze/sounds.json',
			'assets/borderhaze/sounds/border_hum.ogg',
			'assets/borderhaze/post_effect/border_haze.json',
			'assets/borderhaze/shaders/post/border_haze.fsh',
			'assets/borderhaze/post_effect/border_edge.json',
			'assets/borderhaze/shaders/post/border_edge.fsh'
		]
		def missing = required.findAll { !entries.contains(it) }

		println "=== Files in the repository (as Gradle sees them) ==="
		println layoutText
		println "=== Files inside ${jarFile.name} ==="
		println entries.collect { "  " + it }.join("\n")

		if (!missing.isEmpty()) {
			throw new GradleException(
				"\n\nMOD JAR IS BROKEN. Missing inside the jar: ${missing}\n" +
				"Expected repository layout:\n" +
				"  src/main/java/dev/borderhaze/BorderHaze.java\n" +
				"  src/main/java/dev/borderhaze/settings|network|server/... (BorderHazeSettings, SettingsPayload, BorderHazeServer, ServerCommands)\n" +
				"  src/main/java/dev/borderhaze/core/AdminPermission.java and glitch/... (GLITCH mechanic, glitch/mixin/ServerPlayerMixin.java)\n" +
				"  src/main/resources/borderhaze.glitch.mixins.json\n" +
				"  src/client/java/dev/borderhaze/client/glitch/... (+ mixin/AvatarRendererMixin.java, mixin/AvatarRenderStateMixin.java)\n" +
				"  src/client/resources/borderhaze.glitch.client.mixins.json and assets/borderhaze/textures/entity/glitch*.png\n" +
				"  src/client/resources/assets/borderhaze/post_effect/glitch.json and shaders/post/glitch.fsh\n" +
				"  src/client/java/dev/borderhaze/client/core/UniformBinder.java (shared by both mechanics)\n" +
				"  src/main/resources/fabric.mod.json\n" +
				"  src/client/java/dev/borderhaze/client/BorderHazeClient.java\n" +
				"  src/client/java/dev/borderhaze/client/mixin/WorldBorderRendererMixin.java\n" +
				"  src/client/resources/borderhaze.client.mixins.json\n" +
				"  src/client/java/dev/borderhaze/client/mixin/LevelRendererMixin.java\n" +
				"  src/client/java/dev/borderhaze/client/render/BorderEffect.java\n" +
				"  src/client/java/dev/borderhaze/client/command/BorderHazeCommand.java\n" +
				"  src/client/java/dev/borderhaze/client/sound/BorderSound.java (+ BorderHumSoundInstance.java)\n" +
				"  src/client/java/dev/borderhaze/client/mixin/optional/HudVignetteMixin.java\n" +
				"  src/client/resources/borderhaze.optional.mixins.json\n" +
				"  src/client/resources/assets/borderhaze/sounds.json and sounds/border_hum.ogg\n" +
				"  src/client/resources/assets/borderhaze/post_effect/border_haze.json\n" +
				"  src/client/resources/assets/borderhaze/shaders/post/border_haze.fsh\n" +
				"  src/client/resources/assets/borderhaze/post_effect/border_edge.json and shaders/post/border_edge.fsh\n" +
				"Actual repository layout:\n${layoutText}\n")
		}
		println "Jar check OK: ${jarFile.name}"
	}
}

tasks.named('build') {
	dependsOn 'verifyModJar'
}

publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}
}
